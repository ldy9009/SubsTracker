name = "sub-tracker"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[env.production]
name = "sub-tracker"

[env.staging]
name = "sub-tracker-staging"

# KV 命名空间配置（默认模板不预设固定 ID，运行 npm run setup 自动生成）

# 静态资源：托管 public/ 目录下的 JS/CSS/HTML 给浏览器
# 使用方式：浏览器访问 /js/lib/api-client.js 等同于 public/js/lib/api-client.js
# 不命中静态资源的请求由 Worker fetch handler 处理（默认行为）
[assets]
directory = "./public"
binding = "ASSETS"

# 定时任务配置（UTC）：
#   0 * * * *    每小时整点：订阅到期检查
#   */10 * * * * 每 10 分钟：定时调用接口（Keep-Alive）
# 在 src/index.js 的 scheduled 中按 event.cron 分发
[triggers]
crons = ["0 * * * *", "*/10 * * * *"]

# 环境变量（可选，也可以在 Cloudflare Dashboard 中设置）
[vars]
ENVIRONMENT = "production"
